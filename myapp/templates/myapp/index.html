{% extends 'myapp/base.html' %}

    {% block body %}
    <div>
        {% for item in item_list %}
        <div class="m-10 flex w-1/2 mx-auto">
            <div> 
                <img class="w-64 rounded-lg" src="{{ item.item_image }}" alt=""> 
            </div>

            <div class="mx-16 my-auto">
                <div class="font-bold">{{ item.item_name }} </div>
                <div>{{ item.item_desc }}</div>
                <div class="text-green-900 font-bold">${{ item.items_price }}</div>
                <div class="my-6"><a class="bg-red-500 hover:bg-red-900 text-white font-bold px-1 py-2 rounded-md" 
                    href="{% url 'myapp:detail' item.id %}">View Details</a>
                </div>

            </div>
        </div>
        {% endfor %}
    </div>
    {% endblock %}
